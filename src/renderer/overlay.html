<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <title>Desktop Crow</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;

        display: none;
        transform-origin: 0 0;
        will-change: transform;
      }

    <canvas id="stage"></canvas>
