<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Meet your crow</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>A crow has noticed your desktop</h1>
      <p id="lede">It seems to like it here. Give her a name so you two can get acquainted.</p>
      <canvas id="stage" class="stage" aria-label="Your crow"></canvas>
      <div class="card" style="margin-top: 14px">
        <label for="name">Name</label>
        <input id="name" type="text" maxlength="24" autocomplete="off" spellcheck="false" />
        <div class="chips" id="chips"></div>
        <div style="margin-top: 16px">
          <label>Pronouns</label>
          <div class="segmented" role="group" aria-label="Pronouns">
            <button type="button" data-g="she" aria-pressed="true">she / her</button>
            <button type="button" data-g="he" aria-pressed="false">he / him</button>
          </div>
        </div>
      </div>
      <p class="muted" id="hint">You can change this any time from the tray icon.</p>
      <div class="actions">
        <button class="primary" id="go" type="button">Let her in</button>
      </div>
    </main>
    <script src="../../app-dist/setup.bundle.js"></script>
  </body>
</html>
