<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Rename your crow</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="wrap">
      <label for="name" id="label">New name</label>
      <input id="name" type="text" maxlength="24" autocomplete="off" spellcheck="false" />
      <p class="muted" style="margin-top: 8px" id="hint"></p>
      <div class="actions">
        <button class="ghost" id="cancel" type="button">Cancel</button>
        <button class="primary" id="save" type="button">Save</button>
      </div>
    </main>
    <script src="../../app-dist/rename.bundle.js"></script>
  </body>
</html>
